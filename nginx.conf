# nginx.conf — Medical Bill Dashboard
# Serves the static HTML and proxies /api/ requests to Paperless-NGX
# so everything stays on the same origin (no CORS needed).
#
# If Paperless-NGX's address changes, this is the ONLY file you need to edit.

server {
    listen 80;

    # Serve the dashboard HTML (the single-page app in ./html/index.html)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Proxy all /api/ requests through to Paperless-NGX.
    # Browser calls /api/documents/ on THIS container (port 8020) —
    # nginx quietly forwards it to the real Paperless-NGX server.
    #
    # We go straight to Paperless on the LAN (paperless.docker.lab:8000)
    # instead of round-tripping through the public https://paperless.thitar.ovh
    # hostname. That public hostname follows the home connection's dynamic IP;
    # nginx resolves a proxy_pass hostname once and caches it for the life of
    # the worker process, so when the home IP changes, nginx keeps hammering
    # the old (now unreachable) IP until the container restarts — that's what
    # caused the "API 502 Bad Gateway" errors. The `resolver` + variable below
    # makes nginx re-resolve periodically so this can't recur, and staying on
    # the LAN also removes the dependency on hairpin NAT working at all.
    location /api/ {
        resolver               127.0.0.11 valid=10s;
        set                    $paperless_upstream paperless.docker.lab:8000;
        # proxy_pass with a variable in the host part disables nginx's usual
        # URI-prefix substitution — it would otherwise send the literal
        # "/api/" for every request, silently dropping the actual path and
        # query string (e.g. /api/tags/?page_size=100 -> /api/). Forward
        # $request_uri explicitly so the original path+query reaches Paperless.
        proxy_pass              http://$paperless_upstream$request_uri;
        proxy_set_header       Host paperless.docker.lab;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
