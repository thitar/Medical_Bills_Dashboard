# nginx.conf — Medical Bill Dashboard
# Serves the static HTML and proxies /api/ requests to Paperless-NGX
# so everything stays on the same origin (no CORS needed).

server {
    listen 80;

    # Serve the dashboard HTML
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Proxy all /api/ requests to Paperless-NGX
    # Change the proxy_pass URL to match your Paperless-NGX address
    location /api/ {
        proxy_pass             https://paperless.thitar.ovh/api/;
        proxy_ssl_server_name  on;
        proxy_set_header       Host paperless.thitar.ovh;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
