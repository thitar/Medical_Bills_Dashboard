# nginx.conf — Medical Bill Dashboard
# Serves the static HTML and proxies /api/ requests to Paperless-NGX
# so everything stays on the same origin (no CORS needed).
#
# If Paperless-NGX's address changes, this is the ONLY file you need to edit.

server {
    listen 80;

    # Serve the dashboard HTML (the single-page app in ./html/index.html)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Proxy all /api/ requests through to Paperless-NGX.
    # Browser calls /api/documents/ on THIS container (port 8020) —
    # nginx quietly forwards it to the real Paperless-NGX server.
    location /api/ {
        proxy_pass             https://paperless.thitar.ovh/api/;
        # proxy_ssl_server_name is required when proxying to an HTTPS
        # backend that uses SNI (most reverse proxies / Let's Encrypt setups do).
        # Without it, nginx may fail the TLS handshake or send the wrong cert request.
        proxy_ssl_server_name  on;
        # Host header must match the backend's expected domain, otherwise
        # some reverse proxies (e.g. Traefik/Caddy in front of Paperless) will 404.
        proxy_set_header       Host paperless.thitar.ovh;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ── If you ever need to switch to a LAN IP instead of the domain ──
# (e.g. if Tailscale DNS conflicts cause nginx to fail to resolve the
# domain at container startup), replace the location /api/ block above with:
#
#   location /api/ {
#       proxy_pass  http://192.168.188.100:8000/api/;   # <- your Paperless-NGX LAN IP:port
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   }
#
# (proxy_ssl_server_name and the Host header are only needed for HTTPS backends —
# drop them if you're proxying to plain http:// on the LAN.)
