# docker-compose.yml — Medical Bill Dashboard
# Serves the dashboard HTML and proxies API calls to Paperless-NGX.
# No CORS configuration needed on Paperless side.
#
# Usage:
#   mkdir -p html
#   cp medical-bill-dashboard.html html/index.html
#   docker compose up -d

services:
  dashboard:
    image: nginx:alpine
    container_name: medical-bill-dashboard
    ports:
      - "8020:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro      # Dashboard files
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Custom nginx config
    restart: unless-stopped
    networks:
      - beacon-net
    labels:
      beacon.enable: "true"
      beacon.host: "mbd.thitar.ovh"
      beacon.port: "8020"
      beacon.access: "lan"    # lan / private / public

networks:
  beacon-net:
    external: true
