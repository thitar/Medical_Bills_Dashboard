# docker-compose.yml — Medical Bill Dashboard
#
# Before running this: on the host, make sure nginx can actually read
# your dashboard file (it runs as its own internal user, not as you):
#
#   chmod o+r ./html/index.html
#
# That's it — no group tricks needed. This container serves LAN-only
# traffic and the file has no secrets in it, so world-readable is fine here.
#
# Usage:
#   docker compose up -d

services:
  dashboard:
    image: nginx:alpine
    container_name: medical-bill-dashboard
    ports:
      - "8020:80"                # host:container — dashboard at http://<server-ip>:8020
    volumes:
      - ./html:/usr/share/nginx/html:ro      # dashboard files (read-only)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # proxy + serving config
    restart: unless-stopped
    networks:
      - beacon-net
    labels:
      beacon.enable: "true"
      beacon.host: "mbd.thitar.ovh"
      beacon.port: "8020"
      beacon.access: "lan"

networks:
  beacon-net:
    external: true
